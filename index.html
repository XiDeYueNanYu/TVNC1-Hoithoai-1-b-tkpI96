<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hội Thoại</title>
    <style>
        :root {
            --color1: #fbfbfb;
            --color3: #393535;
            --color4: #fbfbfb;
            --color12: #393535;
            --structure-bg: rgba(254,156,4,0.5);
            
            --padding-top: 100px;
            --padding-bottom: 100px;
            --padding-left: 60px;
            --padding-right: 60px;

            --title-font-size: 90px;
            --title-color: #393535;
            --neirong-line-height: 2.2;
            
            --character-column-width: 150px;
            --char-box-height: 1.2;

            /* 2 thông số điều chỉnh khoảng cách nội dung */
            --content-top-margin: 10px;     /* Khoảng cách từ nội dung đến lề trên (sau phần tiêu đề) */
            --content-bottom-margin: 300px;  /* Khoảng cách từ nội dung đến lề dưới */

            /* Thông số điều chỉnh vị trí audio controls so với chân trang */
            --audio-bottom-position: 80px;  /* Khoảng cách từ đáy trang lên */
        }

        body {
            background-color: #1a1a1a;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding-bottom: 80px;
        }

        #infoBox { 
            width: 100%; 
            max-width: 800px;
            height: 150px; 
            margin: 0 auto 0px auto; 
            border: 2px solid #7ab9ac; 
            background: #59a898; 
            color: #ffffff; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: clamp(40px, 5vw, 90px);
            font-weight: bold;
        }

        #contactBox { 
            width: 100%; 
            max-width: 800px;
            height: 45px; 
            margin: 0 auto 0px auto; 
            border: 1px solid #7ab9ac; 
            background: #59a898; 
            color: #ffe120; /*ffe120 ffd300*/
            display: flex; 
            align-items: center; 
            justify-content: left; 
            padding-left: 20px;
            font-size: clamp(12px, 2vw, 25px); 
            font-weight: bold;
        }
                #ChuThich { 
            width: 100%; 
            max-width: 800px;
            height: 45px; 
            margin: 0 auto 0px auto; 
            border: 1px solid #7ab9ac; 
            background: #59a898; 
            color: #ffe120; /*ffe120 ffd300*/
            display: flex; 
            align-items: center; 
            justify-content: left; 
            padding-left: 20px;
            font-size: clamp(12px, 2vw, 20px); 
            font-weight: nomal;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            width: 100%;
            padding: 0 10px;
            box-sizing: border-box;
            margin-top: var(--content-top-margin);
            margin-bottom: var(--content-bottom-margin);
        }

        .text-box {
            width: 100%;
            max-width: 1500px;
            padding: var(--padding-top) var(--padding-right) var(--padding-bottom) var(--padding-left);
            border: 10px solid var(--color1);
            background-color: var(--color4);
            font-size: 50px;
            color: var(--color3);
            line-height: var(--neirong-line-height);
            text-align: justify;
            box-sizing: border-box;
        }

        .title {
            font-size: var(--title-font-size);
            font-weight: bold;
            color: var(--title-color);
            text-align: center;
            margin-bottom: 30px;
            display: block;
            line-height: 1;
        }

        .dialogue-grid {
            display: grid;
            grid-template-columns: var(--character-column-width) 1fr;
            gap: 40px;
            margin-bottom: 25px;
            align-items: start;
            width: 100%;
        }

        .dialogue-content {
            text-align: left;
            padding-top: 5px; 
        }
        
        .character-box {
            display: flex;
            justify-content: flex-end; 
            align-items: center;   
            line-height: 1.2;    
            width: 100%;
            height: auto;
            padding-top: 35px;
        }

        .character-name {
            padding: 2px 15px; 
            border: 5px solid rgba(73,121,107,0.7);
            border-radius: 15px;
            font-weight: bold;
            font-size: 30px;
            line-height: 1.2;
            display: inline-block; 
            vertical-align: middle;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .character-name:hover {
            transform: scale(1.02);
            box-shadow: 0 0 10px rgba(73,121,107,0.6);
        }

        .character-name.playing {
            background-color: #ffcc00 !important;
            box-shadow: 0 0 15px rgba(255,204,0,0.8);
        }

        .colon {
            font-weight: bold;
            font-size: 35px;
            margin-left: 10px; 
            margin-right: 5px; 
            line-height: 1.2;
        }

        .translated-word {
            position: relative;
            display: inline-block;
            margin-top: 0px;
            background-color: rgba(167,187,174,0.3);
            padding: 3px 3px;
            border-radius: 8px;
            line-height: 1.2;
        }

        .annotation-top {
            position: absolute;
            top: -38px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 25px;
            color: var(--color12);
            background-color: rgba(167,187,174,0.7);
            padding: 5px 10px;
            border-radius: 8px;
            white-space: nowrap;
            line-height: 1;
            font-weight: normal;
        }

        .structure-main {
            background-color: var(--structure-bg);
            padding: 2px 10px;
            border-radius: 8px;
        }

        .structure-dependent {
            border-bottom: 10px solid var(--structure-bg);
            padding-bottom: 0px;
        }

        /* Thanh điều khiển audio - góc dưới bên phải */
        .floating-controls {
            position: fixed;
            bottom: var(--audio-bottom-position);
            right: 20px;
            background-color: #f0f0f0;
            padding: 10px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
            text-align: center;
            display: block;
            z-index: 1000;
            transition: all 0.3s ease;
        }

        #audioPlayer {
            width: 100%;
            margin-bottom: 10px;
        }

        .time-row {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        .time-box-group {
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        .button-group {
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        .floating-controls p#timeDisplay {
            font-size: 28px;
            color: #FFFFFF;
            background-color: #000000;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
            margin: 0;
        }

        .floating-controls .time-box {
            font-size: 16px;
            color: #FFFFFF;
            background-color: #555555;
            padding: 5px 10px;
            border-radius: 5px;
            min-width: 60px;
        }

        .tua-buttons {
            display: flex;
            justify-content: center;
            gap: 5px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }

        .action-buttons {
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        .control-button {
            width: 50px;
            height: 50px;
            background-color: #363535;
            color: white;
            border: none;
            border-radius: 50%;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            display: inline-flex;
            justify-content: center;
            align-items: center;
        }

        .control-button:disabled {
            background-color: #888888;
            cursor: not-allowed;
        }

        .control-button:hover:not(:disabled) {
            background-color: #000000;
        }

        .pause-play-button {
            background-color: #FF4500;
        }

        .pause-play-button:hover {
            background-color: #CC3700;
        }

        .toggle-button {
            background-color: #4682B4;
        }

        .toggle-button:hover {
            background-color: #36648B;
        }

        .loop-button {
            background-color: #3c923c;
        }

        .loop-button:hover {
            background-color: #347d34;
        }

        .clear-button {
            background-color: #bc3f13;
        }

        .clear-button:hover {
            background-color: #d15124;
        }

        /* Thanh lựa chọn chế độ */
        .floating-mode-bar {
            position: fixed;
            bottom: 0;
            min-width: 800px;
            left: 50%;
            transform: translateX(-50%);
            background-color: #59a898;
            padding: 10px;
            border-radius: 0;
            box-shadow: 0 -2px 5px rgba(0, 0, 0, 0.3);
            display: flex;
            justify-content: center;
            gap: 20px;
            z-index: 1000;
        }

        .mode-button {
            padding: 12px 24px;
            border: 0 solid #cddfdc;
            background: #b3d6cf; /*b3d6cf 93c5bb*/
            color: #293437;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 8px;
            min-width: 120px;
            transition: all 0.3s;
        }

        .mode-button.active {
            border: 3px solid #ffffff;
            background: #f0f0f0;
            color: #293437;
        }

        /* Quiz Container */
        #quizContainer {
            display: none;
            font-family: Arial, sans-serif;
            width: 100%;
            max-width: 800px;
            margin: 2px auto;
            padding: 10px;
            box-sizing: border-box;
        }

        #quizInstructions {
            font-size: 18px;
            color: #a7cbc3; /*f7e19c f4f8a6*/
            background-color: #59a898;
            padding: 2px;
            border-radius: 8px;
                        margin-top: 5px;
            margin-bottom: 20px;
            text-align: center;
            line-height: 1.5;
        }

        .question {
            margin-bottom: 18px;
            padding: 16px;
            color: #293437;
            border: 0px solid #509788;
            border-radius: 10px;
            background-color: #ffffff;
            font-size: 25px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .question.selected {
            background-color: #B7D7AA;
        }

        #result {
            margin-top: 30px;
            padding: 20px;
            display: none;
            border: 5px solid #509788;
            border-radius: 10px;
            font-size: 20px;
            font-weight: bold;
            background-color: #ffffff;
            color: #007a33;
            line-height: 1.8;
        }

        .wrong-answer {
            color: #f65936;
            margin: 12px 0;
            font-size: 18px;
        }

        #submitQuiz {
            padding: 12px 24px;
            border: 3px solid #2c544c;
            background-color: #feb45b;
            border-radius: 8px;
            color: black;
            cursor: pointer;
            font-size: 20px;
            font-weight: bold;
            display: block;
            margin: 30px auto;
        }

        #submitQuiz:hover {
            background-color: #e4a251;
        }

        /* Tắt highlight khi chạm trên mobile */
        * {
            -webkit-tap-highlight-color: transparent;
            -webkit-tap-highlight-color: rgba(0,0,0,0);
        }

        .control-button,
        .mode-button,
        #submitQuiz,
        .question {
            -webkit-appearance: none;
            outline: none;
            -webkit-user-select: none;
            user-select: none;
        }

        .control-button:active,
        .mode-button:active,
        #submitQuiz:active,
        .question:active {
            opacity: 0.7;
            transform: scale(0.95);
            transition: all 0.1s ease;
        }

        /* RESPONSIVE */
        @media (max-width: 768px) {
            :root {
                --padding-top: 40px;
                --padding-bottom: 40px;
                --padding-left: 20px;
                --padding-right: 20px;
                --title-font-size: 50px;
                --neirong-line-height: 2.6;
                --character-column-width: 80px;
                --audio-bottom-position: 70px;
            }
                        #infoBox { 
                        width: 95%;
            height: 80px; 
                        font-size: clamp(40px, 5vw, 90px);
                        }
                        #contactBox { 
            width: 93%; 
            height: 40px; 
            font-size: clamp(15px, 2vw, 25px); 
            font-weight: bold;
                        }
                        #ChuThich { 
            width: 93%; 
            height: 20px; 
            font-size: clamp(12px, 2vw, 25px); 
            font-weight: normal;
                        }
            .text-box {
                font-size: 20px;
                padding: 30px 15px;
                border-width: 6px;
            }

            .title {
                font-size: 30px;
                margin-bottom: 20px;
            }

            .character-name {
                font-size: 16px;
                padding: 4px 10px;
                border-width: 4px;
            }

            .colon {
                font-size: 16px;
                margin-left: 3px;
                margin-right: 3px;
            }

            .annotation-top {
                font-size: 13px;
                top: -20px;
                padding: 2px 2px;
                border-radius: 1px;
            }

            .dialogue-grid {
                gap: 5px;
                margin-bottom: 20px;
            }

            .character-box {
                padding-top: 11px;
            }

            .floating-controls {
                padding: 8px;
            }

            .control-button {
                width: 40px;
                height: 40px;
                font-size: 14px;
            }

            .floating-controls p#timeDisplay {
                font-size: 22px;
                padding: 4px 8px;
            }

            .floating-controls .time-box {
                font-size: 13px;
                min-width: 50px;
                padding: 4px 8px;
            }

            .floating-mode-bar {
                width: 90%;
                min-width: 100px;
                padding: 8px;
                gap: 15px;
            }

            .mode-button {
                padding: 10px 18px;
                font-size: 18px;
                min-width: 100px;
            }

            #quizInstructions {
                font-size: 20px;
                padding: 10px;
            }

            .question {
                font-size: 18px;
                padding: 14px;
                border-width: 4px;
            }

            #result {
                font-size: 18px;
                padding: 15px;
            }

            #submitQuiz {
                padding: 10px 20px;
                font-size: 18px;
            }
        }
    </style>
</head>

    <script>
        
const text = `

        function renderText(rawText) {
            let lines = rawText.trim().split('\n');
            let outputHtml = '';

            if (lines.length > 0) {
                outputHtml += `<div class="title">${lines[0]}</div>`;
            }

            for (let i = 1; i < lines.length; i++) {
                let line = lines[i].trim();
                if (!line) continue;

                const charMatch = line.match(/┋(.*?):┋/);

                let content = line.replace(/┋.*?:┋/, "").trim();

                content = applyDictionary(content);

                content = content.replace(/╠(.*?)╣/g, (m, c) => {
                    return c.replace(/(.*?)(┝[^┝┥]*┥|$)/g, (im, dep, main) => {
                        let res = '';
                        if (dep) res += `<span class="structure-dependent">${dep}</span>`;
                        if (main) res += `<span class="structure-main">${main.slice(1, -1)}</span>`;
                        return res;
                    });
                });

                const bgColor = characterMap[charName] || "#ffffff";
                const dialogueId = `dialogue-${i-1}`;
                
                outputHtml += `
                    <div class="dialogue-grid" id="${dialogueId}">
                        <div class="character-box">
                            <span class="character-name" 
                                  data-index="${i-1}" 
                                  data-character="${charName}"
                                  style="background-color: ${bgColor}">
                                ${charName}
                            </span>
                            <span class="colon">:</span>
                        </div>
                        <div class="dialogue-content">${content}</div>
                    </div>`;
            }

            document.getElementById('textDisplay').innerHTML = outputHtml;
            dialogueElements = document.querySelectorAll('.dialogue-grid');
            addCharacterClickEvents();
        }

        function addCharacterClickEvents() {
            const characterNames = document.querySelectorAll('.character-name');
            characterNames.forEach((nameElement, index) => {
                nameElement.addEventListener('click', function() {
                    const dialogueIndex = parseInt(this.getAttribute('data-index'));
                    playDialogue(dialogueIndex);
                });
            });
        }

function applyDictionary(text) {
    // Sắp xếp từ dài đến ngắn để ưu tiên cụm từ trước
    const keys = Object.keys(dictionary).sort((a, b) => b.length - a.length);
    
    let result = text;

    keys.forEach((key) => {
        const parts = key.split('@');
        const mainWord = parts[0]; 
        const context = parts.length > 1 ? parts[1] : "";
        const fullSearchTerm = mainWord + context;

        // Sử dụng Regex với Lookbehind và Lookahead để đảm bảo là một từ trọn vẹn
        // (?<!\w): Không có ký tự chữ cái nào đứng trước
        // (?!\w): Không có ký tự chữ cái nào đứng sau
        // Lưu ý: Với tiếng Việt có dấu, ta nên dùng ranh giới khoảng trắng hoặc dấu câu
        const escapedTerm = fullSearchTerm.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        
        // Regex này đảm bảo từ phải đứng độc lập (không nằm trong từ khác)
        const regex = new RegExp(`(?<![a-zA-ZÀ-ỹ])${escapedTerm}(?![a-zA-ZÀ-ỹ])`, 'g');

        const htmlReplacement = `
            <span class="translated-word">
                <span class="annotation-top">${dictionary[key]}</span>${mainWord}
            </span>${context}`;

        // Kiểm tra nếu từ này chưa được bao bọc bởi thẻ HTML nào khác
        result = result.replace(regex, (match) => {
            return htmlReplacement;
        });
    });

    return result;
}

        const audioPlayer = document.getElementById("audioPlayer");
        const timeDisplay = document.getElementById("timeDisplay");
        const loopStart = document.getElementById("loopStart");
        const loopEnd = document.getElementById("loopEnd");
        const loopButton = document.getElementById("loopButton");
        const clearButton = document.getElementById("clearButton");
        const rewind5sButton = document.getElementById("rewind5sButton");
        const rewind1sButton = document.getElementById("rewind1sButton");
        const forward1sButton = document.getElementById("forward1sButton");
        const forward5sButton = document.getElementById("forward5sButton");
        const pausePlayButton = document.getElementById("pausePlayButton");
        const toggleControlsButton = document.getElementById("toggleControlsButton");
        const floatingControls = document.getElementById("floatingControls");
        const tuaButtons = document.querySelector('.tua-buttons');

        function formatTime(seconds) {
            const minutes = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${minutes.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }

        function updateTimeDisplay() {
            if (timeDisplay) {
                timeDisplay.textContent = formatTime(audioPlayer.currentTime);
            }
        }

        let customLoopStart = null;
        let customLoopEnd = null;
        let clickCount = 0;
        let isLooping = false;
        let isDialoguePlaying = false;
        let controlsVisible = true;

        const updateInterval = setInterval(updateTimeDisplay, 1000);

        timeDisplay.onclick = () => {
            if (audioPlayer.paused) {
                clickCount++;
                if (clickCount === 1) {
                    customLoopStart = audioPlayer.currentTime;
                    loopStart.textContent = formatTime(customLoopStart);
                } else if (clickCount === 2) {
                    customLoopEnd = audioPlayer.currentTime;
                    if (customLoopEnd <= customLoopStart) {
                        customLoopEnd = null;
                        loopEnd.textContent = "--:--";
                    } else {
                        loopEnd.textContent = formatTime(customLoopEnd);
                    }
                    clickCount = 0;
                }
            }
        };

        audioPlayer.ontimeupdate = function() {
            updateTimeDisplay();
            
            if (isDialoguePlaying && currentDialogueIndex < dialogueTimings.length) {
                const timing = dialogueTimings[currentDialogueIndex];
                if (audioPlayer.currentTime >= timing.end) {
                    stopDialogue();
                }
            }
            
            if (isLooping && customLoopStart !== null && customLoopEnd !== null) {
                if (audioPlayer.currentTime >= customLoopEnd) {
                    audioPlayer.currentTime = customLoopStart;
                }
            }
        };

        function playDialogue(index) {
            if (index >= 0 && index < dialogueTimings.length) {
                stopDialogue();
                currentDialogueIndex = index;
                const timing = dialogueTimings[currentDialogueIndex];
                
                audioPlayer.currentTime = timing.start;
                audioPlayer.play();
                
                isDialoguePlaying = true;
                pausePlayButton.textContent = "停";
                highlightCharacterName(index, true);
            }
        }

        function stopDialogue() {
            audioPlayer.pause();
            pausePlayButton.textContent = "播";

            document.querySelectorAll('.character-name').forEach(name => {
                name.classList.remove('playing');
            });

            isDialoguePlaying = false;
        }

        function highlightCharacterName(index, isPlaying) {
            const characterNames = document.querySelectorAll('.character-name');
            characterNames.forEach((name, i) => {
                name.classList.remove('playing');
                if (i === index && isPlaying) {
                    name.classList.add('playing');
                }
            });
        }

        rewind5sButton.onclick = () => { if (!isLooping) audioPlayer.currentTime = Math.max(0, audioPlayer.currentTime - 5); updateTimeDisplay(); };
        rewind1sButton.onclick = () => { if (!isLooping) audioPlayer.currentTime = Math.max(0, audioPlayer.currentTime - 1); updateTimeDisplay(); };
        forward1sButton.onclick = () => { if (!isLooping) audioPlayer.currentTime = Math.min(audioPlayer.duration, audioPlayer.currentTime + 1); updateTimeDisplay(); };
        forward5sButton.onclick = () => { if (!isLooping) audioPlayer.currentTime = Math.min(audioPlayer.duration, audioPlayer.currentTime + 5); updateTimeDisplay(); };

        pausePlayButton.onclick = () => {
            if (audioPlayer.paused) {
                audioPlayer.play();
                pausePlayButton.textContent = "停";
                if (isDialoguePlaying) highlightCharacterName(currentDialogueIndex, true);
            } else {
                audioPlayer.pause();
                pausePlayButton.textContent = "播";
                if (isDialoguePlaying) stopDialogue();
            }
        };

        loopButton.onclick = () => {
            if (customLoopStart !== null && customLoopEnd !== null) {
                audioPlayer.currentTime = customLoopStart;
                audioPlayer.play();
                isLooping = true;
                rewind5sButton.disabled = true;
                rewind1sButton.disabled = true;
                forward1sButton.disabled = true;
                forward5sButton.disabled = true;
                pausePlayButton.textContent = "停";
            }
        };

        clearButton.onclick = () => {
            customLoopStart = null;
            customLoopEnd = null;
            loopStart.textContent = "--:--";
            loopEnd.textContent = "--:--";
            clickCount = 0;
            isLooping = false;
            rewind5sButton.disabled = false;
            rewind1sButton.disabled = false;
            forward1sButton.disabled = false;
            forward5sButton.disabled = false;
        };

        toggleControlsButton.onclick = () => {
            if (controlsVisible) {
                timeDisplay.style.display = "none";
                tuaButtons.style.display = "none";
                pausePlayButton.style.display = "none";
                loopStart.style.display = "none";
                loopEnd.style.display = "none";
                loopButton.style.display = "none";
                clearButton.style.display = "none";
                toggleControlsButton.textContent = "示";
                controlsVisible = false;
            } else {
                timeDisplay.style.display = "inline-block";
                tuaButtons.style.display = "flex";
                pausePlayButton.style.display = "inline-flex";
                loopStart.style.display = "inline-block";
                loopEnd.style.display = "inline-block";
                loopButton.style.display = "inline-flex";
                clearButton.style.display = "inline-flex";
                toggleControlsButton.textContent = "藏";
                controlsVisible = true;
            }
        };

        audioPlayer.onpause = audioPlayer.onended = function() {
            pausePlayButton.textContent = "播";
            stopDialogue();
        };

        function loadQuiz() {
            const questionsDiv = document.getElementById('questions');
            questionsDiv.innerHTML = '';
            quizData.forEach((item, index) => {
                const questionDiv = document.createElement('div');
                questionDiv.className = 'question';
                questionDiv.textContent = `Câu ${index + 1}: ${item.question}`;
                if (userSelections[index] === true) questionDiv.classList.add('selected');
                questionDiv.onclick = () => {
                    questionDiv.classList.toggle('selected');
                    userSelections[index] = questionDiv.classList.contains('selected');
                };
                questionsDiv.appendChild(questionDiv);
            });
        }

        function checkAnswers() {
            let score = 0;
            const total = quizData.length;
            let wrongAnswers = [];

            quizData.forEach((item, index) => {
                const userAnswer = userSelections[index] === true;
                const correctAnswer = item.correct;

                if (userAnswer === correctAnswer) {
                    score++;
                } else {
                    const userChoice = userAnswer ? "正确" : "错误";
                    const correctChoice = correctAnswer ? "正确" : "错误";
                    wrongAnswers.push({
                        num: index + 1,
                        content: item.question,
                        user: userChoice,
                        correct: correctChoice
                    });
                }
            });

            const resultDiv = document.getElementById('result');
            resultDiv.style.display = 'block';
            resultDiv.innerHTML = `<h3>结果: ${score}/${total} 正ực (${(score/total * 100).toFixed(2)}%)</h3>`;

                                                if (wrongAnswers.length === 0) {
                                resultDiv.innerHTML += '<p style="color:#007a33; font-size:22px;">恭喜！全部正确！</p>';
                        } 

            resultDiv.scrollIntoView({ behavior: 'smooth' });
        }

        const dialogueModeButton = document.getElementById('dialogueMode');
        const quizModeButton = document.getElementById('quizMode');
        const dialogueContainer = document.getElementById('dialogueContainer');
        const quizContainer = document.getElementById('quizContainer');

        dialogueModeButton.addEventListener('click', () => {
            dialogueContainer.style.display = 'flex';
            quizContainer.style.display = 'none';
            floatingControls.style.display = 'block';
            dialogueModeButton.classList.add('active');
            quizModeButton.classList.remove('active');
            
            // Khôi phục vị trí cuộn
            setTimeout(() => {
                window.scrollTo({
                    top: lastScrollPosition,
                    behavior: 'instant'
                });
            }, 0);
        });

        quizModeButton.addEventListener('click', () => {
            lastScrollPosition = window.scrollY; // Lưu vị trí hiện tại trước khi chuyển
            
            dialogueContainer.style.display = 'none';
            quizContainer.style.display = 'block';
            floatingControls.style.display = 'none';
            audioPlayer.pause();
            quizModeButton.classList.add('active');
            dialogueModeButton.classList.remove('active');
            loadQuiz();
            document.getElementById('result').style.display = 'none';
            window.scrollTo(0, 0); // Lên đầu trang cho phần Quiz
        });

        document.getElementById('submitQuiz').addEventListener('click', checkAnswers);

        renderText(text);
        audioPlayer.onloadedmetadata = () => updateTimeDisplay();
    </script>
</body>
